# The server is started programmatically from io.realworld.app.App (via AppConfig.setup),
# which passes the port and the application module explicitly. Only the deployment port is
# declared here so the value is discoverable; it is kept in sync with AppConfig.SERVER_PORT.
#
# NOTE: do not add `ktor.application.modules` here. Ktor resolves config-declared modules by
# reflection on startup, and `AppConfig.setup` is a server factory rather than an
# `Application.() -> Unit` module, so declaring it would fail at boot.
ktor {
    deployment {
        port = 8080
    }
}
