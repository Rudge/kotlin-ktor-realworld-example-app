plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.0.21'
    id 'application'
}

group 'io.realworld'
version '1.0-SNAPSHOT'

ext {
    slf4j_version = "2.0.9"
    ktor_version = "3.0.3"
    kodein_version = "7.22.0"
    hikaricp_version = "5.1.0"
    h2_version = "2.2.224"
    exposed_version = "0.56.0"
    junit_version = "4.13.2"
    unirest_version = "1.4.9"
    jackson_version = "2.17.2"
}

repositories {
    mavenCentral()
}

application {
    mainClass = "io.realworld.app.AppKt"
}

// Compile against 17 regardless of which JDK runs the build, so the CI matrix
// (JDK 17 and 21) produces identical bytecode on both legs.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    implementation "org.slf4j:slf4j-simple:$slf4j_version"

    implementation "io.ktor:ktor-server-core:$ktor_version"
    implementation "io.ktor:ktor-server-cio:$ktor_version"
    implementation "io.ktor:ktor-server-netty:$ktor_version"
    implementation "io.ktor:ktor-server-content-negotiation:$ktor_version"
    implementation "io.ktor:ktor-serialization-jackson:$ktor_version"
    implementation "io.ktor:ktor-server-auth:$ktor_version"
    implementation "io.ktor:ktor-server-auth-jwt:$ktor_version"
    implementation "io.ktor:ktor-server-call-logging:$ktor_version"
    implementation "io.ktor:ktor-server-status-pages:$ktor_version"

    implementation "org.kodein.di:kodein-di-jvm:$kodein_version"

    implementation "com.zaxxer:HikariCP:$hikaricp_version"
    implementation "com.h2database:h2:$h2_version"
    implementation "org.jetbrains.exposed:exposed-core:$exposed_version"
    implementation "org.jetbrains.exposed:exposed-dao:$exposed_version"
    implementation "org.jetbrains.exposed:exposed-jdbc:$exposed_version"

    testImplementation "junit:junit:$junit_version"
    testImplementation "com.mashape.unirest:unirest-java:$unirest_version"
    testImplementation "com.fasterxml.jackson.module:jackson-module-kotlin:$jackson_version"
}

test {
    testLogging {
        events "passed", "skipped", "failed"
    }
}
