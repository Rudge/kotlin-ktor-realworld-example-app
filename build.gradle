group 'io.realworld'
version '1.0-SNAPSHOT'

buildscript {
    ext {
        kotlin_version = "1.9.24"
        slf4j_version = "2.0.9"
        ktor_version = "1.2.3"
        kodein_version = "6.1.0"
        hikaricp_version = "5.1.0"
        h2_version = "2.3.232"
        exposed_version = "0.44.1"
        jackson_version = "2.18.9"
        netty_version = "4.1.136.Final"
        commons_io_version = "2.20.0"
        guava_version = "33.4.8-jre"
        junit_version = "4.13.2"
        unirest_version = "1.4.9"
    }

    repositories {
        mavenLocal()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'kotlin'
apply plugin: 'application'

application {
    mainClass = "io.realworld.app.AppKt"
}

repositories {
    mavenLocal()
    mavenCentral()
}

// Ktor 1.2.3 and its jwks-rsa dependency pin 2019-era transitive libraries. These upgrades
// are all within a compatible major line and clear every advisory the CI scan reports.
configurations.all {
    resolutionStrategy.eachDependency { details ->
        def requested = details.requested
        if (requested.group == 'io.netty' && requested.name.startsWith('netty-')) {
            details.useVersion netty_version
            details.because 'advisories fixed after 4.1.37; API-compatible within 4.1.x'
        }
        if (requested.group == 'commons-io' && requested.name == 'commons-io') {
            details.useVersion commons_io_version
            details.because 'GHSA-78wr-2p64-hpwj (high), fixed in 2.14.0'
        }
        if (requested.group == 'com.google.guava' && requested.name == 'guava') {
            details.useVersion guava_version
            details.because 'GHSA-7g45-4rm6-3mm3 / GHSA-5mg8-w23w-74h3, fixed in 32.0.0'
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "org.slf4j:slf4j-simple:$slf4j_version"
    implementation "io.ktor:ktor-server-netty:$ktor_version"
    implementation "io.ktor:ktor-server-cio:$ktor_version"
    implementation "io.ktor:ktor-jackson:$ktor_version"
    implementation "io.ktor:ktor-auth-jwt:$ktor_version"
    implementation "org.kodein.di:kodein-di-generic-jvm:$kodein_version"
    implementation "com.zaxxer:HikariCP:$hikaricp_version"
    implementation "com.h2database:h2:$h2_version"
    implementation "org.jetbrains.exposed:exposed-core:$exposed_version"
    implementation "org.jetbrains.exposed:exposed-jdbc:$exposed_version"
    implementation "org.jetbrains.exposed:exposed-java-time:$exposed_version"
    // ktor-jackson 1.2.3 pulls Jackson 2.9, whose Kotlin module predates kotlin-reflect 1.9.
    implementation "com.fasterxml.jackson.module:jackson-module-kotlin:$jackson_version"
    implementation "com.fasterxml.jackson.core:jackson-databind:$jackson_version"

    testImplementation "junit:junit:$junit_version"
    testImplementation "com.mashape.unirest:unirest-java:$unirest_version"
}

// Target 17 bytecode whichever JDK runs the build (CI builds on 17 and 21), and keep the
// Java/Kotlin targets aligned — Kotlin fails the build if they diverge.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

compileKotlin {
    kotlinOptions.jvmTarget = "17"
}
compileTestKotlin {
    kotlinOptions.jvmTarget = "17"
}

test {
    // Each class boots the app on port 8080 against the in-memory database; a fresh JVM per
    // class gives every suite an empty schema and avoids cross-suite fixture interference.
    forkEvery = 1
    testLogging {
        events "passed", "skipped", "failed"
    }
}
