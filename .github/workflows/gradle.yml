# Build and test on every push/PR to master.
# Matrix: JDK 17 and 21. Gradle deps cached via gradle-build-action.
# JUnit XML published as GitHub check annotations via dorny/test-reporter.

name: CI with Gradle

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [17, 21]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Test
        run: ./gradlew test --no-daemon

      - name: Publish JUnit test report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: JUnit Tests (JDK ${{ matrix.java-version }})
          path: build/test-results/test/*.xml
          reporter: java-junit
          fail-on-error: true
