# CI workflow for building and testing the Kotlin Ktor RealWorld app
# Runs on every push and PR to main/master branches

name: CI Build & Test

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    name: Build & Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [ '17', '21' ]
      fail-fast: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: temurin

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build --no-daemon

    - name: Run tests
      run: ./gradlew test --no-daemon

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-jdk-${{ matrix.java }}
        path: |
          build/reports/tests/
          build/test-results/
        retention-days: 7

    - name: Publish Test Report
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: JUnit Test Results (JDK ${{ matrix.java }})
        path: build/test-results/test/*.xml
        reporter: java-junit
        fail-on-error: false

  # Summary job that requires all matrix jobs to pass
  build-status:
    name: Build Status
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "All builds passed!"
            exit 0
          else
            echo "Some builds failed!"
            exit 1
          fi
